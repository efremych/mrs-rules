rules:
  #REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP)),QUIC,no-track #Блокировка QUIC
  - AND,((RULE-SET,adlist@domain),(NOT,((RULE-SET,exclude_ads@domain)))),AdReject #Блокировка рекламы
  #DIRECT
  - AND,((RULE-SET,check_ip@domain),(NOT,((DOMAIN-SUFFIX, ipinfo.io)))),Check_IP
  - RULE-SET,yandex@domain,Yandex
  #DIRECT_CDN
  - DOMAIN-SUFFIX,icloud.com,Apple #Akamai
  - RULE-SET,binance@domain,Binance #Amazon
  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Twitch_HQ # Разблокировка высокого качества на Twitch.tv (может вызвать рекламу)
  - RULE-SET,twitch@domain,Twitch #Amazon
  #Заблокированные сервисы
  - OR,((RULE-SET,telegram@domain),(RULE-SET,telegram@ipcidr)),Telegram
  - RULE-SET,youtube@domain,YouTube
  - RULE-SET,spotify@domain,Spotify
  - OR,((RULE-SET,meta@domain),(RULE-SET,meta@ipcidr)),Meta
  - RULE-SET,x@domain,X
  - OR,((RULE-SET,google-gemini@domain),(RULE-SET,openai@domain)),AI
  - OR,((RULE-SET,custom@domain),(RULE-SET,custom@ipcidr)),MyCustom
  - RULE-SET,google-ads@domain,Google-ads
  - OR,((RULE-SET,amazon@domain),(RULE-SET,amazon@ipcidr)),Amazon
  - OR,((RULE-SET,akamai@domain),(RULE-SET,akamai@ipcidr)),Akamai
  - OR,((RULE-SET,cloudflare@domain),(RULE-SET,cloudflare@ipcidr)),Cloudflare
  - OR,((RULE-SET,digitalocean@domain),(RULE-SET,digitalocean@ipcidr)),DigitalOcean
  - OR,((RULE-SET,hetzner@domain),(RULE-SET,hetzner@ipcidr)),Hetzner
  - OR,((RULE-SET,oracle@domain),(RULE-SET,oracle@ipcidr)),Oracle
  - RULE-SET,scaleway@ipcidr,Scaleway
