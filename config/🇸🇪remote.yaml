# TUN — рекомендуется прописать (даже если включаешь в UI)
tun:
  enable: true
  stack: system # system — обычно лучше на iOS (меньше оверхеда)
  dns-hijack:
    - any:53 # перехват всего DNS
  auto-route: true # автоматическая маршрутизация
  auto-detect-interface: true
# IPv6 — если используешь
ipv6: false
# Оптимизации (экономия батареи, лучше задержки)
unified-delay: true
tcp-concurrent: true
#DNS
dns:
  enable: true
# 1. Сначала узнаем IP самих DoH-серверов через быстрые публичные DNS
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  # 2. ОСНОВНОЙ СПИСОК (Сюда идут все запросы первым делом)
  # Используем шифрование, чтобы провайдер не видел, куда мы ходим
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  # 3. ЗАПАСНОЙ ВАРИАНТ (Если DoH недоступен или тормозит)
  fallback:
    - system
  # Skip certificate verification to resolve some compatibility issues https://help.nextdns.io/t/g9hdkjz
  skip-cert-verify: true # Для стабильности на iOS (иначе иногда cert-ошибки у NextDNS/AdGuard)
  follow-rule: null # DNS прямые, без прокси — обязательно для iOS/TUN
#  nameserver-policy:
#    '.ru': https://77.88.8.8/dns-query
log-level: silent
allow-lan: true
mixed-port: 7890 # основной порт SOCKS5/HTTP — обязательно!
redir-port: 7891
tproxy-port: 7892
find-process-mode: off
profile: {store-selected: true}
sniffer:
  enable: true
  sniff:
    HTTP:
    TLS:
    # - QUIC               # можно добавить, если нужно
anchors:
  a1: &domain {type: http, format: mrs, behavior: domain, interval: 86400}
  a2: &ipcidr {type: http, format: mrs, behavior: ipcidr, interval: 86400}
  a3: &classical {type: http, format: text, behavior: classical, interval: 86400}
  a4: &inline {type: inline, behavior: classical}

proxies:
  - name: 🇸🇪HostUp
    type: vless
    server: 1.2.3.4
    port: 443
    network: tcp
    udp: true
    tfo: true
    tls: true
    packet-encoding: xudp
    servername: 1.2.3
    client-fingerprint: chrome
    uuid: 123
    flow: 123
    reality-opts:
      public-key: 123
      short-id: 123
  - name: 📋YandexCloud
    type: vless
    server: 5.6.7.8
    port: 443
    network: tcp
    udp: true
    tfo: true
    tls: true
    packet-encoding: xudp
    servername: 1.1.1
    client-fingerprint: chrome
    uuid: 123
    flow: 123
    reality-opts:
      public-key: 123
      short-id: 123

